name: Build FOSS APK

# Baut den foss-Flavor (:app:assembleFossRelease) dieses Repos, damit man
# testen kann, ob der Community-Quellcode ueberhaupt eigenstaendig baut und
# lauffaehig ist — ganz ohne Google-Services/Secrets, genau wie es F-Droids
# eigener Build-Server spaeter tun wird. Signiert wird mit einem im Runner
# frisch erzeugten Wegwerf-Keystore (kein echtes Signing-Secret noetig/vorhanden).
#
# Ergebnis-APK wird nur als Actions-Artefakt hochgeladen (kein Release, kein
# Deploy) — zum Herunterladen und manuellen Installieren/Testen auf einem Geraet.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-foss:
    name: Build foss flavor (unsigned test build)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-foss-v1-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-foss-v1-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate throwaway signing keystore
        # app/build.gradle.kts signingConfigs.release liest KEYSTORE_PATH/
        # KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD unbedingt (project.properties[...]
        # as String wirft ohne gesetzte Property sofort einen Fehler). Damit dieser
        # Build trotzdem ohne echtes Signing-Secret laeuft, wird hier lokal auf dem
        # Runner ein rein temporaerer, nicht-geheimer Keystore erzeugt. Kein Bezug
        # zum echten Release-Keystore des Hauptprojekts.
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/foss-test.jks \
            -storepass foss-test-only \
            -keypass foss-test-only \
            -alias foss-test \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Lethe Community Test Build, OU=CI, O=Lethe, C=DE"

      - name: Build foss Release APK (throwaway-signed)
        run: |
          ./gradlew :app:assembleFossRelease --no-daemon --no-build-cache \
            -PKEYSTORE_PATH=/tmp/foss-test.jks \
            -PKEYSTORE_PASSWORD=foss-test-only \
            -PKEY_ALIAS=foss-test \
            -PKEY_PASSWORD=foss-test-only

      - name: Locate foss APK
        run: |
          APK=$(find app/build/outputs/apk/foss -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "Kein foss-APK gefunden - Build ist fehlgeschlagen oder Output-Pfad hat sich geaendert."
            exit 1
          fi
          echo "APK_PATH=${APK}" >> "$GITHUB_ENV"
          echo "Gefunden: ${APK}"

      - name: Upload foss APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lethe-foss-test-build
          path: ${{ env.APK_PATH }}
          retention-days: 14
